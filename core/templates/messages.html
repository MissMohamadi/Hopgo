{% if messages %}
{% for message in messages %}

<script>
  let message_color = "linear-gradient(to right, #00b09b, #96c93d)"
  if (`{{message.tags}}` == "error") {
    message_color = "red"
  }
  if (`{{message.tags}}` == "info") {
    message_color = ""
  }
  Toastify({
    text: `{{ message }}`,
    className: `{{message.tags}}`,
    style: {
      background: message_color,
    }
  }).showToast();
  console.log(`{{ message }}`, `{{message.tags}}`)</script>
{% endfor %}
{% endif %}

{% if form.errors %}
<!-- <div class="alert alert-error">
    <h4>Please fix the following errors</h4>
    <ul> -->
{% for field in form %}
{% if field.errors %}
<!-- <script>toastr["error"](`{{ field.errors }}`)</script> -->
{% for error in field.errors %}

<script>Toastify({
    text: `{{ field.name }} - {{ error|escape }}`,
    className: "error",
    style: {
      background: "red",
    }
  }).showToast();</script>
{% endfor %}
{% endif %}
{% endfor %}
<!-- </ul> -->
{% if form.non_field_errors %}

<script>Toastify({
    text: `{{ form.non_field_errors.as_text }}`,
    className: "error",
    style: {
      background: "red",
    }
  }).showToast();</script>
{% endif %}
<!-- </div> -->
{% endif %}
