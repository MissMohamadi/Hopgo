{% extends './base.html' %}
{% load static %}
{% load blog_tags %}


{% load user_dashboard_tags %}
{% block extra_css %}
{% endblock extra_css %}

{% block content %}

<!-- Counter boxes START -->
<div class="row mb-4">
    <!-- Counter item -->
    <div class="col-sm-6 col-lg-4 mb-3 mb-lg-0">
        <div class="d-flex justify-content-center align-items-center p-4 bg-purple bg-opacity-15 rounded-3">
            <span class="display-6 lh-1 text-purple mb-0"><i class="fas fa-envelope fa-fw"></i></span>
            <div class="ms-4">
                <div class="d-flex">
                    <h5 class="purecounter mb-0 fw-bold" data-purecounter-start="0" data-purecounter-end="0"
                        data-purecounter-delay="200">0</h5>
                </div>
                <p class="mb-0 h6 fw-light">تیکت ها</p>
            </div>
        </div>
    </div>
    <!-- Counter item -->
    <div class="col-sm-6 col-lg-4 mb-3 mb-lg-0">
        <div class="d-flex justify-content-center align-items-center p-4 bg-success bg-opacity-10 rounded-3">
            <span class="display-6 lh-1 text-success mb-0"><i class="fas fa-medal fa-fw"></i></span>
            <div class="ms-4">
                <div class="d-flex">
                    <h5 class="purecounter mb-0 fw-bold" data-purecounter-start="0" data-purecounter-end="0"
                        data-purecounter-delay="300">0</h5>
                </div>
                <p class="mb-0 h6 fw-light">پروژه ها</p>
            </div>
        </div>
    </div>
</div>
<!-- Counter boxes END -->


{% endblock content %}


{% block extra_js %}
{% endblock extra_js %}
